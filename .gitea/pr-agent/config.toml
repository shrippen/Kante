# PR-Agent settings for Kante (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Kante, the design system of shrippen's
projects: tokens (tokens/palette.json is the single source), CSS and JS
for the web (built into docs/v1), the QML modules Kante and KantePlasma
for Qt Quick, Kirigami and Plasma, and Knust and the plugin kit for
Kimai (kimai/). Many projects copy these files unchanged.
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Token drift: values set in CSS or QML instead of palette.json, built
  files edited instead of rebuilt with ./build.sh, web and QML sides
  drifting apart.
- Breaking changes for the projects that copy Kante: renamed or removed
  tokens, classes, QML properties or kit macros without a note.
- Contrast of new colour pairs below WCAG AA; new components without
  docs and catalogue entry.
- Missing tests for new behaviour.
- Breaches of the repository rules (agent.md).

Skip style, naming and formatting (the token check, QML tests and qmllint run separately), praise, and
guesses you cannot back with the diff. When you find nothing that
matters, say so in one line.
"""

[pr_code_suggestions]
extra_instructions = """
Only suggestions that fix a bug or a missing check; no style.
"""
