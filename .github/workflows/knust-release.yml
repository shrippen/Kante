# Knust release. Tag knust-vX.Y.Z (must match kimai/knust/composer.json's "version").
#   ──► lint ──► build KnustBundle-X.Y.Z.zip (tools/knust-zip.sh) ──► release with notes from kimai/knust/CHANGELOG.md (if it
#   has a matching heading), zip attached.
#
# GitHub only: GitHub is the public channel and the only one with release files. Gitea runs the
# checks and gets the release without files (rule "Gitea prüft, GitHub veröffentlicht"); the job
# condition keeps it off Gitea even where Gitea reads .github/workflows.
name: Knust release

on:
  push:
    tags: ['knust-v*']

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#knust-v}"
          composer=$(php -r 'echo json_decode(file_get_contents("kimai/knust/composer.json"), true)["version"];')
          if [ "$version" != "$composer" ]; then
            echo "Tag $GITHUB_REF_NAME does not match kimai/knust/composer.json version $composer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=KnustBundle-$version.zip" >> "$GITHUB_ENV"

      - name: Lint
        run: find kimai/knust -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Palette
        # knust.css without raw colours; knust-palette.css equal to Kante's build (docs/v1)
        run: kimai/knust/bin/check-palette.sh

      - name: Build plugin zip
        # Kimai expects the folder name var/plugins/KnustBundle/
        run: |
          tools/knust-zip.sh HEAD
          mv "dist/$ZIP" "$ZIP"
          unzip -l "$ZIP"

      - name: Release notes
        run: |
          if grep -qE "^## v?$VERSION( |$)" kimai/knust/CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## v?" v "( |$)" { on = 1; next }
              /^## /                  { on = 0 }
              on
            ' kimai/knust/CHANGELOG.md > notes.md
          else
            echo "Knust $VERSION." > notes.md
          fi

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Knust $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
