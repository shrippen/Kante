# Knust release. Tag knust-vX.Y.Z (must match kimai/knust/composer.json's "version").
#   ──► lint ──► build KnustBundle-X.Y.Z.zip (tools/knust-zip.sh) ──► release with notes from kimai/knust/CHANGELOG.md
#   (the tag's section; the job fails without one), zip attached.
#
# GitHub only: GitHub is the public channel and the only one with release files. Gitea runs the
# checks and gets the release without files (rule "Gitea prüft, GitHub veröffentlicht"); the job
# condition keeps it off Gitea even where Gitea reads .github/workflows.
name: Knust release

on:
  push:
    tags: ['knust-v*']

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#knust-v}"
          composer=$(php -r 'echo json_decode(file_get_contents("kimai/knust/composer.json"), true)["version"];')
          if [ "$version" != "$composer" ]; then
            echo "Tag $GITHUB_REF_NAME does not match kimai/knust/composer.json version $composer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=KnustBundle-$version.zip" >> "$GITHUB_ENV"

      - name: Lint
        run: find kimai/knust -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Palette
        # knust.css without raw colours; knust-palette.css equal to Kante's build (docs/v1)
        run: kimai/knust/bin/check-palette.sh

      - name: Build plugin zip
        # Kimai expects the folder name var/plugins/KnustBundle/
        run: |
          tools/knust-zip.sh HEAD
          mv "dist/$ZIP" "$ZIP"
          unzip -l "$ZIP"

      - name: Release notes
        # The tag's section in kimai/knust/CHANGELOG.md (## [X.Y.Z], ## X.Y.Z or ## vX.Y.Z).
        # No section, no release: the job fails instead of posting a placeholder.
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit
                     t = $2
                     if (t ~ /^\[.*\]$/) t = substr(t, 2, length(t) - 2)
                     if (t ~ /^v/) t = substr(t, 2)
                     if (t == v) { found = 1; next } }
            found { print }' kimai/knust/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::kimai/knust/CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Knust $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
