# QML and token checks (decision G-06 from Kaiwa's question bundle 2).
# Runs in an Arch Linux container: current Qt 6, Kirigami and libplasma from the packages,
# so tst_kanteplasma runs too.
#
# Public mirror: Gitea pushes every branch and tag here on each commit. This runs the checks
# and reports them back to the commit on Gitea as the status "github / test", where the pull
# requests live. There are no pull requests on GitHub, so everything runs on push.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the repository (commit
# statuses).
name: QML

on:
  push:
    branches: ["**"]

# No concurrency group: every commit runs to the end and keeps its own status, a newer push
# does not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/Kante/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    env:
      QT_QPA_PLATFORM: offscreen
      LANG: C.UTF-8
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs python qt6-base qt6-declarative qt6-shadertools qt6-svg kirigami libplasma php
      - uses: actions/checkout@v4
      - name: Tokens
        run: python3 tools/check-tokens.py
      - name: QML tests
        run: tools/check-qml.sh
      - name: Knust tests
        run: php kimai/knust/tests/assets.php
      - name: Release notes
        # The shared script (projects carry a copy) and Kante's own changelogs
        run: |
          tools/release-notes.test.sh
          tools/release-notes.sh --check CHANGELOG.md
          tools/release-notes.sh --check kimai/knust/CHANGELOG.md
          tools/release-notes.sh --check kimai/kit/CHANGELOG.md
      - name: qmllint (reports, does not block)
        # Reports without blocking: the container is the latest Arch, so a Qt update can bring
        # new warning categories at any time (Qt 6.12, October 2026). Tests block, lint reports;
        # a finding is fixed here, then taken over by the apps. What is off and why:
        # tools/qmllint.sh.
        continue-on-error: true
        run: tools/qmllint.sh || { echo "::warning::qmllint has findings (see this step); fix them in Kante"; exit 1; }

  # Also runs when qml failed or was cancelled, so Gitea never keeps a stale "pending".
  report:
    needs: qml
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          case "$RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          desc=$RESULT
          if [ -n "$STARTED" ]; then desc="$RESULT in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULT: ${{ needs.qml.result }}
          STARTED: ${{ needs.qml.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
