<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 256" width="600" height="256" role="img" aria-labelledby="t">
<title id="t">While the dialog was built, a wrapping text changed its height inside the dialog&#x27;s own height, a binding loop; now the content height follows only after the build.</title>
