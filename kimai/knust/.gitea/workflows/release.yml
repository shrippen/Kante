name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          composer=$(python3 -c "import json;print(json.load(open('composer.json'))['version'])")
          if [ "$version" != "$composer" ]; then
            echo "Tag $GITHUB_REF_NAME does not match composer.json version $composer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli > /dev/null
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build plugin zip
        # Kimai expects the folder name var/plugins/KnustBundle/
        run: |
          git archive --format=zip --prefix=KnustBundle/ -o "KnustBundle-$VERSION.zip" HEAD
          unzip -l "KnustBundle-$VERSION.zip"

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            /^## /        { on = 0 }
            on
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          body=$(python3 -c "import json;print(json.dumps({'tag_name':'$GITHUB_REF_NAME','name':'Knust $VERSION','body':open('notes.md').read()}))")
          id=$(curl -sf -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -sf -X POST "$API/releases/$id/assets?name=KnustBundle-$VERSION.zip" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@KnustBundle-$VERSION.zip" > /dev/null
