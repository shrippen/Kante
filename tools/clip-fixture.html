<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kante clip fixture</title>
<!-- One instance of every surface with the cut corner, the two-cut surfaces and the cases that give the cut up.
     tools/check-clip.py reads the computed clip-path of each element in four variants and widths and compares it
     with tools/clip-expected.json. A new cut surface is added here (data-fx names it). -->
<link rel="stylesheet" href="../docs/v1/shrippen.css">
</head>
<body>
<div id="fx">
<div class="ch" data-fx="ch">x</div><div class="install-card" data-fx="install-card">x</div><div class="hero-shot" data-fx="hero-shot">x</div>
<div class="shots"><img data-fx="shots img" alt=""><figure data-fx="shots figure" data-entrance class="is-in">x</figure></div><div class="feat" data-fx="feat">x</div><div class="callout" data-fx="callout">x</div>
<div class="codeblock" data-fx="codeblock">x</div><div class="table-wrap" data-fx="table-wrap"><table class="table"><tr><td>x</td></tr></table></div>
<div class="showcase"><figure data-fx="showcase figure" data-entrance class="is-in">x</figure></div>
<div class="release-shots"><figure data-fx="release-shots figure">x</figure></div><div class="flow"><div class="flow-node" data-fx="flow-node">x</div></div>
<div class="faq"><details data-fx="faq details"><summary>q</summary>a</details></div><button class="tile" data-fx="tile">x</button>
<div class="toast" data-fx="toast">x</div><div class="tabs"><button data-fx="tabs button">x</button><a data-fx="tabs a">x</a><i class="tabs-ind" data-fx="tabs-ind"></i></div>
<span class="sticker" data-fx="sticker">x</span><ul class="menu" data-fx="menu"><li>x</li></ul><div class="option" data-fx="option">x</div><div class="bulk-bar" data-fx="bulk-bar">x</div>
<div class="sheet" data-fx="sheet">x</div><div class="sheet is-drawer" data-fx="sheet is-drawer">x</div><div class="sheet is-side" data-fx="sheet is-side">x</div>
<div class="status" data-fx="status">x</div><div class="palette" data-fx="palette">x</div><a class="link-tile" data-fx="link-tile">x</a><div class="launch" data-fx="launch">x</div>
<div class="map-frame" data-fx="map-frame">x</div><div class="tier-card" data-fx="tier-card">x</div><div class="hint-card" data-fx="hint-card">x</div>
<div class="editbar" data-fx="editbar">x</div><div class="editbar has-menu" data-fx="editbar has-menu">x</div><div class="login" data-fx="login">x</div>
<div class="board-card" data-fx="board-card">x</div><div class="board-card" data-fx="board-card open"><details open><summary>x</summary></details></div>
<table class="table cards-sm" data-fx="cards-sm table"><tbody><tr data-fx="cards-sm tr"><td>x</td></tr></tbody></table>
<div class="dialog" data-fx="dialog">x</div><button class="talk" data-fx="talk">x</button><div class="path"><a class="node" data-fx="path node">x</a></div>
<button class="btn" data-fx="btn">x</button><button class="btn btn-primary" data-fx="btn-primary">x</button><button class="btn btn-sm btn-danger" data-fx="btn-danger sm">x</button>
</div>
</body>
</html>
